name: Relay Feature Build

on:
  push:
    branches:
      - relayinfo_feature
    tags:
      - 'v*-relay*'

jobs:
  build:
    name: Build & Sign APKs
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Init submodules
        run: git submodule update --init --recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
        if: env.KEYSTORE != ''
        run: echo "$KEYSTORE" | base64 -d > release-keystore.jks

      - name: Create keystore.properties
        env:
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
        if: env.KEYSTORE_PROPERTIES != ''
        run: |
          echo "$KEYSTORE_PROPERTIES" > keystore.properties
          sed -i "s|storeFile=.*|storeFile=$GITHUB_WORKSPACE/release-keystore.jks|" keystore.properties

      - name: Decode google-services.json
        env:
          GSERVICES: ${{ secrets.GSERVICES }}
        if: env.GSERVICES != ''
        run: echo "$GSERVICES" | base64 -d > androidApp/google-services.json

      - name: Create local.properties
        env:
          MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ -n "$MAPS_API_KEY" ]; then
            echo "MAPS_API_KEY=$MAPS_API_KEY" >> local.properties
          fi

      - name: Build Google Release APK
        run: ./gradlew assembleGoogleRelease -Pci=true -x uploadCrashlyticsMappingFileGoogleRelease

      - name: Build F-Droid Release APK
        run: ./gradlew assembleFdroidRelease -Pci=true

      - name: Upload Google APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-google-release
          path: androidApp/build/outputs/apk/google/release/androidApp-google-release.apk
          retention-days: 30

      - name: Upload F-Droid APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-fdroid-release
          path: androidApp/build/outputs/apk/fdroid/release/androidApp-fdroid-release.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: true
          generate_release_notes: true
          files: |
            androidApp/build/outputs/apk/google/release/androidApp-google-release.apk
            androidApp/build/outputs/apk/fdroid/release/androidApp-fdroid-release.apk